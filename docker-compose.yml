version: '3.8'

services:
  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: credit_default_container
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge